[meta]
config_name = config_ground_truth.ini

[samples]
directory = ground_truth_samples
train_tensor_file = train_samples.pt
test_tensor_file  = test_samples.pt

[ground_truth_dataset]
# fraction of the full dataset to keep for train+test (default: 0.10)
subset-fraction = 0.10
# fraction of the subset to hold out as test (default: 0.10 of the subset)
test-fraction = 0.10
# batch size used when assembling the tensor batches
batch_size = 64
# random seed for reproducibility
seed = 42

[features]
directory = features_ground_truth

[rewards]
file = rewards_ground_truth.json

[generator]
batch_size = 100  # can still be used if needed

[evaluate]
method = pixel_area
threshold = 0.0

[feature_extraction]
# feature settings for ground-truth

[train_reward_model]
num_epochs = 1
batch_size = 32
lr = 1e-3

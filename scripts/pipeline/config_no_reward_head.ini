[meta]
config_name = config.ini

[samples]
directory = samples
train_tensor_file = train_samples.pt
test_tensor_file  = test_samples.pt

[features]
directory = features

[rewards]
file = rewards.json

[generator]
batch_size = 10

[evaluate]
method = cnn_cross_ent_loss
threshold = 0.0

[feature_extraction]
# Any options for this step

[train_reward_model]
num_epochs = 30
batch_size = 32
lr = 1e-3

[fine_tune]
# SGD lr for the diffusion net
lr_diff = 1e-5
target_class = 0
# 0.0001
kl_gamma_z_pre = 0.01
#  0.0001
kl_gamma_z_prev = 0.01


output_directory = greedy_outputs
batch_size = 250
num_iters  = 2
reward_epochs = 40
save_interval = 5


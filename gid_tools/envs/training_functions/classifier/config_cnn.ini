[dataset]
# Path to the full JSONL dataset
jsonl_filename = tools_dataset_classes_reduced.jsonl

# Train/test split (fractions)
test_fraction = 0.1

[loader]
batch_size = 64
num_workers = 4
pin_memory = True

[model]
# number of classes in your dataset
num_classes = 5

[training]
epochs = 5
learning_rate = 1e-3
optimizer = adam

[paths]
# where to save the trained CNN
model_output = checkpoints/model.pth

# path to save logs or metrics
log_dir = logs/
